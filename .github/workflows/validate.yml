name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The private build image, by digest (mitsevox/nflstreet2-build's image workflow prints it). The target job runs in it (through the plan job's
  # `image` output, because a container image cannot read env), and tools/measuring_tools.py
  # reads this variable to record it as provenance.
  BUILD_IMAGE: ghcr.io/mitsevox/nflstreet2-build@sha256:2b506e071fd65979ec80b9e49052a8bcbc842853a8eb79ed80e35bc6a4f936cf

jobs:
  plan:
    name: Plan affected targets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_targets: ${{ steps.plan.outputs.has_targets }}
      # A container image cannot read the env context; the plan job hands BUILD_IMAGE on.
      image: ${{ env.BUILD_IMAGE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select affected target inputs
        id: plan
        run: python3 tools/ci_targets.py
      - name: Check the declared tier
        # Pull requests only: the PR body's Tier against what the diff touches (CONTRIBUTING.md).
        run: python3 tools/tier.py
      - name: Check the credits
        # Only when config/site.json switches contributors on: the Credits line and credits.tsv.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/credits.py

  tests:
    name: Tool tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run tool tests
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 tools/targets.py check
          python3 tools/versions.py check
          python3 tools/evidence.py check
      - name: Check the scaffold
        uses: mitsevox/mitsevox.github.io/.github/actions/scaffold-check@main

  target:
    name: Validate ${{ matrix.target }}
    needs: [plan, tests]
    if: needs.plan.outputs.has_targets == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      # The publish step reads the merged PR's Credits line when contributors are on.
      pull-requests: read
    container:
      image: ${{ needs.plan.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      TARGET_ID: ${{ matrix.target }}
    steps:
      - name: Require a repository contribution branch
        env:
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: test "$SOURCE_REPOSITORY" = "$GITHUB_REPOSITORY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Provide target original
        # The image holds /orig/<target id>/sys/main.dol; build.py reads orig/<target id>/sys/main.dol
        # and refuses an original whose hash differs from config/<target id>/baseline.json.
        run: |
          mkdir -p "orig/$TARGET_ID/sys"
          cp "/orig/$TARGET_ID/sys/main.dol" "orig/$TARGET_ID/sys/main.dol"
      - name: Configure target
        # Records where the build image installs the tools, so nothing is downloaded.
        run: >-
          python3 build.py configure --target "$TARGET_ID" --dtk /usr/local/bin/dtk --binutils /binutils
          --compilers /compilers --wibo /usr/local/bin/wibo --objdiff /usr/local/bin/objdiff-cli
      - name: Build, verify complete executable and measure progress
        id: measure
        # Fails unless the complete executable matches the original; writes build/<target id>/report.json.
        run: |
          python3 build.py --target "$TARGET_ID"
          echo "measured-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Project checks
        # The original-object relinks (GNU ld and SN's ngcld), the tool tests that need the
        # toolchain, and a dry run of the site's publish script on this report.
        run: python3 build.py check --target "$TARGET_ID"
      - name: List measuring tools
        id: tools
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          delimiter="tools-$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "lines<<$delimiter"
            python3 tools/measuring_tools.py
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
      - name: Publish to the site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: mitsevox/mitsevox.github.io/.github/actions/publish@main
        with:
          target: ${{ matrix.target }}
          report: build/${{ matrix.target }}/report.json
          tools: ${{ steps.tools.outputs.lines }}
          measured-at: ${{ steps.measure.outputs.measured-at }}
          # decomp_report.py names the executable's sections; units carry no main/ prefix.
          code-sections: Code section 1,Code section 2,Code section 3,Code section 4,Code section 5,Code section 6,Code section 7
          unit-prefix: ''
          app-client-id: ${{ vars.DATA_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}

  complete:
    name: Validate targets
    needs: [plan, tests, target]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PLAN: ${{ needs.plan.result }}
      TESTS: ${{ needs.tests.result }}
      HAS_TARGETS: ${{ needs.plan.outputs.has_targets }}
      TARGETS: ${{ needs.target.result }}
    steps:
      - name: Require all selected target validations
        run: |
          test "$PLAN" = success && test "$TESTS" = success
          if [ "$HAS_TARGETS" = true ]; then test "$TARGETS" = success; else test "$TARGETS" = skipped; fi
