name: Baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  baseline:
    name: Toolchain baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      actions: read
    env:
      BUILD_ENVIRONMENT: ghcr.io/mitsevox/nflstreet2-build@sha256:2b4967b77a5d74fb4575ec522ca0a60d8769605e7f5c9c162fb4e55959250aae
    steps:
      - name: Require a repository contribution branch
        env:
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: test "$SOURCE_REPOSITORY" = "$GITHUB_REPOSITORY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Bind inventory key to reviewed data extents
        id: inventory-inputs
        run: |
          python3 - <<'PYKEY' >> "$GITHUB_OUTPUT"
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import sdk_map
          print('units=' + sdk_map.unit_input_digest(Path('.')))
          PYKEY
      - name: Restore verified inventory metadata
        id: inventory-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build/analysis/summary.json
            build/analysis/symbols.txt
          key: inventory-v1-${{ runner.os }}-${{ env.BUILD_ENVIRONMENT }}-${{ steps.inventory-inputs.outputs.units }}-${{ hashFiles('tools/**/*.py', 'tools/*.json', 'config/GN7E69/baseline.json', 'config/GN7E69/analysis.json', 'config/GN7E69/sdk.json') }}
          restore-keys: |
            inventory-v1-${{ runner.os }}-${{ env.BUILD_ENVIRONMENT }}-
      - name: Verify publication handoff rules
        run: |
          python3 -m unittest discover -s tests -p test_ci_policy.py -v
          python3 -m unittest discover -s tests -p test_publication.py -v
      - name: Select verified final-integration reports
        id: publication
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publication.py select
      - name: Decide required validation lanes
        id: validation
        run: |
          python3 tools/ci_policy.py --reused "${{ steps.publication.outputs.reused || 'false' }}" \
            --cache-hit "${{ steps.inventory-cache.outputs.cache-hit || 'false' }}"
      - name: Verify review clearance logic
        if: steps.validation.outputs.full == 'true'
        run: node --test tests/review_gate.mjs
      - name: Authenticate pinned build environment
        if: steps.validation.outputs.inventory == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Verify complete original-object relink
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            "$BUILD_ENVIRONMENT" python3 tools/baseline.py --original /orig/main.dol
      - name: Prepare pinned compiler stages
        if: steps.validation.outputs.full == 'true'
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            "$BUILD_ENVIRONMENT" python3 tools/setup_compiler.py
      - name: Verify SN linker against complete target
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            "$BUILD_ENVIRONMENT" python3 tools/baseline.py --original /orig/main.dol \
              --sn-linker build/toolchain/ProDG/3.9.3/ngcld.exe --wrapper build/toolchain/wibo
      - name: Verify source build against complete target
        if: steps.validation.outputs.full == 'true'
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            "$BUILD_ENVIRONMENT" python3 tools/source_build.py --original /orig/main.dol
      - name: Provide memory headroom for full inventory analysis
        if: steps.validation.outputs.inventory == 'true'
        run: |
          sudo fallocate -l 8G /swap-inventory
          sudo chmod 600 /swap-inventory
          sudo mkswap /swap-inventory
          sudo swapon /swap-inventory
      - name: Verify provisional function inventory
        if: steps.validation.outputs.inventory == 'true'
        run: |
          docker run --rm --memory=5g --memory-swap=13g --env MIMALLOC_PURGE_DELAY=0 \
            --env MIMALLOC_SHOW_STATS=1 --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            "$BUILD_ENVIRONMENT" python3 tools/analyze.py --original /orig/main.dol \
              --reuse-inventory --cache-context "$BUILD_ENVIRONMENT" || {
              tail -80 build/analysis/analysis.log
              sudo dmesg | tail -20
              exit 1
            }
      - name: Verify compiler stages
        if: steps.validation.outputs.full == 'true'
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            "$BUILD_ENVIRONMENT" python3 -m unittest discover -s tests -v
      - name: Verify inventory cache invalidation and real warm reuse
        if: steps.validation.outputs.inventory == 'true'
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            "$BUILD_ENVIRONMENT" python3 -m unittest discover -s tests -p test_inventory_cache.py -v
      - name: Measure exact and fuzzy source comparisons
        if: steps.validation.outputs.full == 'true'
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            "$BUILD_ENVIRONMENT" python3 tools/matching.py --original /orig/main.dol
          python3 -m unittest discover -s tests -p test_matching.py -v
          docker run --rm --user "$(id -u):$(id -g)" --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            "$BUILD_ENVIRONMENT" python3 -m unittest discover -s tests -p test_function_compare.py -v
      - name: Verify both progress exports, maps, history and contributor credits
        if: steps.validation.outputs.full == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_MAIN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          SQUASH_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          export_args=(--dol build/source/main.dol --revision "$GITHUB_SHA"
            --source-report build/source/report.json --analysis-dir build/analysis
            --comparison-report build/matching/report.json --fetch-provenance)
          if [ -n "$SQUASH_BASE" ]; then
            export_args+=(--squash-base "$SQUASH_BASE")
          fi
          if [ "$PUBLISH_MAIN" = true ]; then
            python3 tools/restore_history.py
            export_args+=(--append-current --previous build/activity/previous.json)
          fi
          python3 tools/export_progress.py "${export_args[@]}"
      - name: Verify activity and live receipts on the host
        if: steps.validation.outputs.full == 'true'
        run: |
          command -v git
          python3 -m unittest discover -s tests -p test_activity.py -v
          python3 -m unittest discover -s tests -p test_export_progress.py -v
      - name: Prepare verified publication handoff
        if: github.event_name == 'pull_request'
        run: python3 tools/publication.py prepare
      - name: Upload verified publication handoff
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-publication-v1-${{ github.run_attempt }}
          path: build/publication/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish authenticated final-integration reports
        if: steps.publication.outputs.reused == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/restore_history.py
          python3 tools/publication.py promote
      - name: Save verified inventory metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.inventory-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build/analysis/summary.json
            build/analysis/symbols.txt
          key: ${{ steps.inventory-cache.outputs.cache-primary-key }}
      - name: Upload decomp.dev report
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: GN7E69_report
          path: build/GN7E69/report.json
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@98ef48e41587a300b82de4cf298aa98b57b2faae
        if: github.ref == 'refs/heads/main'
        with:
          path: build/site

  pages:
    name: Publish progress
    needs: baseline
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified progress page
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
