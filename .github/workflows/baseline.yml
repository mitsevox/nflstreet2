name: Baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  baseline:
    name: Toolchain baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      actions: read
    env:
      BUILD_ENVIRONMENT: ghcr.io/mitsevox/nflstreet2-build@sha256:2b4967b77a5d74fb4575ec522ca0a60d8769605e7f5c9c162fb4e55959250aae
    steps:
      - name: Require a repository contribution branch
        env:
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: test "$SOURCE_REPOSITORY" = "$GITHUB_REPOSITORY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify review clearance logic
        run: node --test tests/review_gate.mjs
      - name: Verify complete original-object relink
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker run --rm --user "$(id -u):$(id -g)" --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            "$BUILD_ENVIRONMENT" python3 tools/baseline.py --original /orig/main.dol
      - name: Verify activity and Git provenance on the host
        run: |
          command -v git
          python3 -m unittest discover -s tests -p test_activity.py -v
      - name: Verify compiler stages
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            "$BUILD_ENVIRONMENT" python3 -m unittest discover -s tests -v
      - name: Verify SN linker against complete target
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            "$BUILD_ENVIRONMENT" python3 tools/baseline.py --original /orig/main.dol \
              --sn-linker build/toolchain/ProDG/3.9.3/ngcld.exe --wrapper build/toolchain/wibo
      - name: Verify source build against complete target
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            "$BUILD_ENVIRONMENT" python3 tools/source_build.py --original /orig/main.dol
      - name: Provide memory headroom for full inventory analysis
        run: |
          sudo fallocate -l 8G /swap-inventory
          sudo chmod 600 /swap-inventory
          sudo mkswap /swap-inventory
          sudo swapon /swap-inventory
      - name: Verify provisional function inventory
        run: |
          docker run --rm --memory=5g --memory-swap=13g --env MIMALLOC_PURGE_DELAY=0 \
            --env MIMALLOC_SHOW_STATS=1 --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            "$BUILD_ENVIRONMENT" python3 tools/analyze.py --original /orig/main.dol || {
              tail -80 build/analysis/analysis.log
              sudo dmesg | tail -20
              exit 1
            }
      - name: Measure exact and fuzzy source comparisons
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            "$BUILD_ENVIRONMENT" python3 tools/matching.py --original /orig/main.dol
          python3 -m unittest discover -s tests -p test_matching.py -v
          docker run --rm --user "$(id -u):$(id -g)" --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            "$BUILD_ENVIRONMENT" python3 -m unittest discover -s tests -p test_function_compare.py -v
      - name: Export public progress page
        run: |
          python3 tools/progress.py --dol build/source/main.dol --revision "$GITHUB_SHA" \
            --source-report build/source/report.json --analysis-dir build/analysis \
            --comparison-report build/matching/report.json
      - name: Export decomp.dev report
        run: |
          python3 tools/decomp_report.py --dol build/source/main.dol --revision "$GITHUB_SHA" \
            --source-report build/source/report.json --analysis-dir build/analysis \
            --comparison-report build/matching/report.json
      - name: Verify current mapping in both progress exports
        run: python3 tools/check_progress_maps.py --comparison-report build/matching/report.json
      - name: Export verified history and contributor credits
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_MAIN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          SQUASH_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          activity_args=(--fetch-provenance)
          if [ -n "$SQUASH_BASE" ]; then
            activity_args+=(--squash-base "$SQUASH_BASE")
          fi
          if [ "$PUBLISH_MAIN" = true ]; then
            python3 tools/restore_history.py
            python3 tools/activity.py "${activity_args[@]}" --append-current --previous build/activity/previous.json
          else
            python3 tools/activity.py "${activity_args[@]}"
          fi
          python3 -m unittest discover -s tests -p test_activity.py -v
      - name: Upload decomp.dev report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: GN7E69_report
          path: build/GN7E69/report.json
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@98ef48e41587a300b82de4cf298aa98b57b2faae
        with:
          path: build/site

  pages:
    name: Publish progress
    needs: baseline
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified progress page
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
