name: Baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  baseline:
    name: Toolchain baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      BUILD_ENVIRONMENT: ghcr.io/mitsevox/nflstreet2-build@sha256:2b4967b77a5d74fb4575ec522ca0a60d8769605e7f5c9c162fb4e55959250aae
    steps:
      - name: Require a repository contribution branch
        env:
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: test "$SOURCE_REPOSITORY" = "$GITHUB_REPOSITORY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify complete original-object relink
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker run --rm --user "$(id -u):$(id -g)" --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            "$BUILD_ENVIRONMENT" python3 tools/baseline.py --original /orig/main.dol
      - name: Verify compiler stages
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            "$BUILD_ENVIRONMENT" python3 -m unittest discover -s tests -v
      - name: Verify SN linker against complete target
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            "$BUILD_ENVIRONMENT" python3 tools/baseline.py --original /orig/main.dol \
              --sn-linker build/toolchain/ProDG/3.9.3/ngcld.exe --wrapper build/toolchain/wibo
      - name: Verify analyzed relink against complete target
        run: |
          free -m
          sudo fallocate -l 8G /swap-analysis
          sudo chmod 600 /swap-analysis
          sudo mkswap /swap-analysis
          sudo swapon /swap-analysis
          oom_before=$(awk '$1 == "oom_kill" { print $2 }' /proc/vmstat)
          if ! docker run --rm --user "$(id -u):$(id -g)" --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            "$BUILD_ENVIRONMENT" python3 tools/analyze.py --original /orig/main.dol; then
            oom_after=$(awk '$1 == "oom_kill" { print $2 }' /proc/vmstat)
            echo "Out-of-memory kill events during analysis: $((oom_after - oom_before))"
            exit 1
          fi
